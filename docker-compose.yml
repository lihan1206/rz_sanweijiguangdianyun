version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: pointcloud_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: pointcloud_db
      MYSQL_USER: pointcloud_user
      MYSQL_PASSWORD: pointcloud_pass
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      timeout: 10s
      retries: 10
      interval: 5s

  api:
    build: .
    container_name: pointcloud_api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=pointcloud_db
      - DB_USER=pointcloud_user
      - DB_PASSWORD=pointcloud_pass
      - JWT_SECRET_KEY=your-secret-key-change-in-production
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - MAX_FILE_SIZE=52428800
      - UPLOAD_DIR=/app/uploads
      - ALLOWED_EXTENSIONS=.las,.ply
      - PROCESSING_TIMEOUT=300
      - MAX_WORKERS=4
      - LOG_LEVEL=INFO
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      timeout: 10s
      retries: 5
      interval: 30s
      start_period: 30s

volumes:
  mysql_data:
    driver: local
