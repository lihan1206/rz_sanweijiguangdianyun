version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: pointcloud_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-pointcloud_db}
      MYSQL_USER: ${DB_USER:-pointcloud_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-pointcloud_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - pointcloud_network

  app:
    build: .
    container_name: pointcloud_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-mysql+pymysql://pointcloud_user:pointcloud_pass@db:3306/pointcloud_db}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-52428800}
      - UPLOAD_TIMEOUT=${UPLOAD_TIMEOUT:-300}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./uploads:/app/uploads
      - ./processed:/app/processed
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pointcloud_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4

volumes:
  mysql_data:

networks:
  pointcloud_network:
    driver: bridge
